name: CI

on:
  # No push:[main] trigger — merges to main are already validated by the PR run,
  # so re-running the suite post-merge is redundant. Tag pushes (v*) still run so
  # the package + release jobs below can fire.
  push:
    tags: ["v*"]
  pull_request:
    branches: [main]
  # Manual run: builds the Windows artifacts and keeps them as workflow artifacts
  # only. It never creates a GitHub Release (the release job needs a tag push).
  workflow_dispatch:

# Least privilege: every job gets read-only contents unless it asks for more.
permissions:
  contents: read

# Cancel an in-flight run when a new commit is pushed to the same ref (e.g. a PR
# branch gets a follow-up push). Distinct refs (different PRs, tags) don't collide.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: typecheck · lint · format · test · build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          package-manager-cache: false

      - name: Enable Corepack (pnpm)
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate protobuf code
        # @conduit/rustplus-proto's generated output is gitignored; regenerate it
        # before typecheck/build (`pnpm gen:proto`).
        run: pnpm gen:proto

      - name: Typecheck
        run: pnpm -r typecheck

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      # The code is published as a new repo whose issues and PRs are numbered
      # afresh, so a `#<n>` reference here would point at nothing, or later at an
      # unrelated issue. Explain the reason inline instead; the commit or PR is
      # where the link belongs.
      - name: No issue or PR numbers in tracked files
        run: |
          # "#" and digits after the line start, a space, "(", a quote, etc. Not
          # after "&" (an HTML entity), "/" or a letter or digit, so another
          # repo's reference (alexemanuelol/rustplusplus#527) passes.
          pattern='(^|[^&/[:alnum:]])#[0-9]+\b'
          # Matches that are not references (grep -o prints file:line:match):
          allow=(
            -e '#[0-9]{6}$'   # a six-digit hex color, e.g. "#313338"
            -e '::#[0-9]{3}$' # a three-digit CSS hex color right after a colon
            # an unknown item's name ("#" and its id), as a storage monitor shows it
            -e '^packages/discord/src/(items|panels)\.test\.ts:[0-9]+:"#[0-9]+$'
          )
          hits=$(git grep -n -o -I -E "$pattern" | grep -v -E "${allow[@]}" || true)
          if [ -n "$hits" ]; then
            echo "::error::Issue or PR numbers found. Explain the reason in words instead:"
            echo "$hits"
            exit 1
          fi

      # Build before Test: downstream packages (e.g. @conduit/rustplus-client)
      # import @conduit/rustplus-proto via its package `exports`, which resolve
      # to `dist/`. The generated protobuf module is copied into `dist/generated`
      # only by rustplus-proto's `build` script (`copy:generated`), so `dist` is
      # incomplete until the build runs. Testing first would fail to resolve
      # `./generated/rustplus.js`.
      - name: Build
        run: pnpm -r build

      - name: Test
        run: pnpm -r test

  package:
    name: package (Windows artifacts)
    # Tag pushes feed the release job; a manual run stops here, leaving the
    # installer + portable exe as workflow artifacts.
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: windows-latest
    # electron-builder downloads the Electron build it packages by itself.
    outputs:
      # For the signing step (see the placeholder in the release job).
      unsigned-artifact-id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          package-manager-cache: false

      - name: Check the tag matches the app version
        # electron-builder names the files after apps/desktop's version, so a
        # v2026.11.0 tag must ship Conduit-2026.11.0-*.exe, not whatever the version says.
        if: github.event_name == 'push'
        shell: bash
        run: |
          version=$(node -p "require('./apps/desktop/package.json').version")
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match apps/desktop version $version"
            exit 1
          fi

      - name: Enable Corepack (pnpm)
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate protobuf code
        run: pnpm gen:proto

      - name: Build packages
        run: pnpm -r build

      - name: Build Windows artifacts
        # --publish never: the release job publishes, after signing, attesting
        # and scanning the final files. electron-builder must not publish itself.
        working-directory: apps/desktop
        run: pnpm exec electron-builder --config electron-builder.yml --win nsis portable --publish never

      - name: Stage the installer and portable exe
        # Named explicitly, so a missing artifact (or a renamed one) fails here
        # instead of shipping a release without it.
        shell: bash
        run: |
          version=$(node -p "require('./apps/desktop/package.json').version")
          mkdir -p out
          cp "apps/desktop/release/Conduit-$version-setup.exe" \
             "apps/desktop/release/Conduit-$version-portable.exe" out/
          ls -l out

      - name: Upload the unsigned artifacts
        id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: conduit-windows-unsigned
          path: out/*.exe
          if-no-files-found: error
          retention-days: 14

  release:
    name: release (GitHub Release)
    # Tag pushes only. A manual run (workflow_dispatch) never creates a Release,
    # even when started on a tag.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the Release and upload its assets
      id-token: write # Sigstore OIDC token for the provenance attestation
      attestations: write # store the attestation
    steps:
      - name: Download the unsigned artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: conduit-windows-unsigned
          path: out

      # ── CODE SIGNING PLACEHOLDER ─────────────────────────────────────────────
      # Not wired up yet: it needs SignPath Foundation approval, which needs a
      # public repo and a license. Once approved, add here:
      #   - signpath/github-action-submit-signing-request (pinned to a SHA), with
      #     github-artifact-id: ${{ needs.package.outputs.unsigned-artifact-id }},
      #     wait-for-completion: true and output-artifact-directory: out,
      #     so the signed files replace the unsigned ones in out/. That action
      #     needs `actions: read` added to this job's permissions.
      #   - a SignPath signing policy that deep-signs the inner Conduit.exe as
      #     well as the NSIS installer and the portable exe, if supported.
      #   - in apps/desktop/electron-builder.yml: the `publish:` block (owner/repo)
      #     and win.publisherName matching the certificate subject.
      # Everything below (checksums, attestation, VirusTotal, the Release) must
      # run on the signed bytes, so it stays after this step.
      # ─────────────────────────────────────────────────────────────────────────

      - name: Write SHA256SUMS.txt
        working-directory: out
        run: |
          sha256sum -- *.exe > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Attest build provenance
        id: attest
        # Attestations need a public repo on non-Enterprise plans. Skipped until
        # the repo goes public.
        if: github.event.repository.private == false
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: out/*.exe

      - name: Check for a VirusTotal API key
        id: vt-key
        env:
          VT_API_KEY: ${{ secrets.VT_API_KEY }}
        run: |
          if [ -n "$VT_API_KEY" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Scan with VirusTotal
        id: virustotal
        # Uploading makes the files publicly retrievable on VirusTotal, so only
        # scan what is being published anyway: tag pushes from the public repo.
        # Skipped while the repo is private or the VT_API_KEY secret is missing.
        # The action switches to VirusTotal's large-file upload URL for files of
        # 32 MB and more (the installer is ~90 MB). The free API allows 4
        # requests/minute; a large file costs 2 (upload URL + upload), so 2
        # files/minute stays inside it.
        if: github.event.repository.private == false && steps.vt-key.outputs.present == 'true'
        uses: crazy-max/ghaction-virustotal@936d8c5c00afe97d3d9a1af26d017cfdf26800a2 # v5.0.0
        with:
          vt_api_key: ${{ secrets.VT_API_KEY }}
          files: out/*.exe
          request_rate: 2

      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          ATTESTED: ${{ steps.attest.outcome == 'success' }}
          # "path=url,path=url" from the VirusTotal step; empty when skipped.
          VT_ANALYSIS: ${{ steps.virustotal.outputs.analysis }}
        run: |
          tag="$GITHUB_REF_NAME"
          repo_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
          {
            echo "Built by GitHub Actions from commit $GITHUB_SHA ([workflow run]($repo_url/actions/runs/$GITHUB_RUN_ID))."
            echo "How to check these files: [Verifying your download]($repo_url/blob/$tag/docs/verifying-your-download.md)."
            echo
            echo "### SHA-256 checksums"
            echo
            echo '```'
            cat out/SHA256SUMS.txt
            echo '```'
            if [ "$ATTESTED" = "true" ]; then
              echo
              echo "### Build provenance"
              echo
              echo "Each file carries a GitHub build provenance attestation:"
              echo
              echo '```'
              echo "gh attestation verify <file>.exe --repo $GITHUB_REPOSITORY"
              echo '```'
            fi
            if [ -n "$VT_ANALYSIS" ]; then
              echo
              echo "### VirusTotal"
              echo
              IFS=',' read -ra entries <<< "$VT_ANALYSIS"
              for entry in "${entries[@]}"; do
                echo "- [\`$(basename "${entry%%=*}")\`](${entry#*=})"
              done
            fi
          } > notes.md
          cat notes.md
          prerelease=()
          case "$tag" in *-*) prerelease=(--prerelease) ;; esac
          gh release create "$tag" out/*.exe out/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" \
            --title "Conduit $tag" \
            --notes-file notes.md \
            --verify-tag \
            "${prerelease[@]}"
